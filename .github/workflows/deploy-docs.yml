# The docs site builds against the base path /helia-ui, so it deploys to
# https://ambiqai.github.io/helia-ui/. The repository guard on both jobs keeps
# the workflow a no-op wherever this tree is not that repository, which is how
# it can travel with the split rather than be written after it.
name: Deploy docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'AmbiqAI/helia-ui'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      # docs/ installs from its own lockfile; see ci.yml.
      - name: Install docs dependencies
        run: npm ci --prefix docs

      - name: Build docs site
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/dist

  deploy:
    if: github.repository == 'AmbiqAI/helia-ui'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
