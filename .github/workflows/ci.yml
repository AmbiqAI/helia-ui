# The one required workflow for this repository. Everything a change has to
# clear lives here so that a single check gates a pull request, and so that the
# gallery deployment has one run to wait on: `deploy-docs.yml` fires from this
# workflow's conclusion and publishes the artifact the `gallery` job built,
# rather than building main a second time.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package checks and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        run: npm run validate

      # Kept as its own step even once `validate` runs the suite too: the unit
      # tests are the only cover the extractors and the model projections have,
      # and a run that skipped them should be visible as a skipped step rather
      # than disappear inside an aggregate script.
      - name: Run unit tests
        run: npm test

  gallery:
    name: Gallery build and browser tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      # docs/ is a standalone project with its own lockfile, not a workspace of
      # this package: a `workspaces` field here would follow the package into a
      # consumer's dependency tree. The two installs are therefore separate, and
      # each lockfile has to stand on its own.
      - name: Install docs dependencies
        run: npm ci --prefix docs

      # chromium runs the route and accessibility specs; chromium-headless-shell
      # is what rehype-mermaid renders diagrams with at build time. They are
      # separate downloads.
      - name: Install browsers
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Build docs site
        run: npm run docs:build

      - name: Run docs smoke tests
        run: npm run docs:test

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: docs/playwright-report/
          retention-days: 7

      # Uploaded only for a main build in this repository, because the
      # deployment workflow is its only consumer. That workflow pulls this exact
      # artifact out of this run, so what reaches Pages is what the steps above
      # built and tested.
      - name: Upload Pages artifact
        if: >-
          github.repository == 'AmbiqAI/helia-ui' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/dist

  consumer:
    name: Installable package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # No install and no build step: the package ships source, so the tarball
      # is produced from the checked-out tree exactly as a consumer receives it.
      - name: Pack the tarball
        id: pack
        run: |
          set -euo pipefail
          name="$(npm pack --ignore-scripts --silent)"
          mv "${name}" "${RUNNER_TEMP}/${name}"
          echo "tarball=${RUNNER_TEMP}/${name}" >>"${GITHUB_OUTPUT}"

      # Outside the repository, so nothing resolves through the working tree: a
      # file that `files` omits is absent here even though it is in git, which
      # is the failure a consumer hits and the reason this job exists.
      - name: Install the tarball into a scratch consumer
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/consumer"
          cd "${RUNNER_TEMP}/consumer"
          npm init --yes >/dev/null
          npm install --ignore-scripts --legacy-peer-deps "${{ steps.pack.outputs.tarball }}"

      - name: Verify the installed package
        run: node .github/scripts/verify-package.mjs --consumer "${RUNNER_TEMP}/consumer"
