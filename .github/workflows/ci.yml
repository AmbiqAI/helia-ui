# Package, gallery and consumer checks share one gate. The deployment workflow
# publishes the gallery artifact from this run so Pages receives tested output.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  # Several sites depend on this package, so a break the ecosystem introduces
  # between pushes should not wait for the next release to surface.
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the pinned npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        run: npm run validate

      - name: Check React types
        run: npm run typecheck

  gallery:
    name: Gallery build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Use the pinned npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      # docs/ is a standalone project with its own lockfile, not a workspace of
      # this package: a `workspaces` field here would follow the package into a
      # consumer's dependency tree. The two installs are therefore separate, and
      # each lockfile has to stand on its own.
      - name: Install docs dependencies
        run: npm ci --prefix docs

      - name: Check gallery types
        run: npm run docs:check

      # chromium runs the route and accessibility specs; chromium-headless-shell
      # is what rehype-mermaid renders diagrams with at build time. They are
      # separate downloads.
      - name: Install browsers
        working-directory: docs
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Build docs site
        run: npm run docs:build

      - name: Run docs smoke tests
        run: npm run docs:test

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: docs/playwright-report/
          retention-days: 7

      # Uploaded only for a main build in this repository, because the
      # deployment workflow is its only consumer. That workflow pulls this exact
      # artifact out of this run, so what reaches Pages is what the steps above
      # built and tested.
      - name: Upload Pages artifact
        if: >-
          github.repository == 'AmbiqAI/helia-ui' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/dist

  consumer:
    name: Installable package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Use the pinned npm
        run: npm install --global npm@11.19.0

      # No install and no build step: the package ships source, so the tarball
      # is produced from the checked-out tree exactly as a consumer receives it.
      - name: Pack the tarball
        id: pack
        run: |
          set -euo pipefail
          name="$(npm pack --ignore-scripts --silent)"
          mv "${name}" "${RUNNER_TEMP}/${name}"
          echo "tarball=${RUNNER_TEMP}/${name}" >>"${GITHUB_OUTPUT}"

      # Outside the repository, so nothing resolves through the working tree: a
      # file that `files` omits is absent here even though it is in git, which
      # is the failure a consumer hits and the reason this job exists.
      - name: Install the tarball into a scratch consumer
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/consumer"
          cd "${RUNNER_TEMP}/consumer"
          npm init --yes >/dev/null
          npm install --ignore-scripts --legacy-peer-deps "${{ steps.pack.outputs.tarball }}"

      - name: Verify the installed package
        run: node .github/scripts/verify-package.mjs --consumer "${RUNNER_TEMP}/consumer"

  security:
    name: Dependency audit
    # Advisories land between pushes, so this answers the schedule rather than
    # gating a commit that was clean when it was written.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Use the pinned npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Audit what a consumer inherits
        run: npm run audit:production

      - name: Audit the gallery's own dependencies
        run: npm audit --prefix docs --audit-level=high

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [package, gallery, consumer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all merge checks to pass
        env:
          PACKAGE: ${{ needs.package.result }}
          GALLERY: ${{ needs.gallery.result }}
          CONSUMER: ${{ needs.consumer.result }}
        run: |
          for result in "$PACKAGE" "$GALLERY" "$CONSUMER"; do
            if [ "$result" != success ]; then
              echo "A required job did not succeed: $result" >&2
              exit 1
            fi
          done
